name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 发布（框架依赖，体积小，需用户自装 .NET 8 Desktop Runtime）
        run: >
          dotnet publish src/BSGroupGenerator.Wpf/BSGroupGenerator.Wpf.csproj
          -c Release -r win-x64 --self-contained false
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:DebugType=none
          /p:AllowedReferenceRelatedFileExtensions=none
          -o publish

      - name: 打包 zip
        run: Compress-Archive -Path publish/* -DestinationPath "BSGroupGenerator-${{ github.ref_name }}-win-x64.zip"

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "BSGroupGenerator-$tag-win-x64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag --title $tag --generate-notes --notes "**运行前请先安装 .NET 8 Desktop Runtime**（https://dotnet.microsoft.com/download/dotnet/8.0）——本包为框架依赖版，体积小，不含运行时。" $zip
          }
