name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 打包（pack.ps1：发布框架依赖版，zip 内含 LICENSE / 英文上手 / 第三方许可清单）
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\pack.ps1

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $v = ([regex]::Match((Get-Content src/SliderSorter.Wpf/SliderSorter.Wpf.csproj -Raw), '<Version>([^<]+)</Version>')).Groups[1].Value
          $zip = "dist/SliderSorter_v$v.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag --title $tag --generate-notes --notes "**运行前请先安装 .NET 8 Desktop Runtime**（https://dotnet.microsoft.com/download/dotnet/8.0）——本包为框架依赖版，体积小，不含运行时。" $zip
          }
